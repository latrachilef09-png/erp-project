services:
  postgres:
    image: postgres:16

    container_name: mip-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mip_erp

    ports:
    - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  api:
    build:
      context: ./backend

    container_name: erp-api

    ports:
      - "3001:3001"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mip_erp?schema=public
      JWT_SECRET: mySuperSecretKey

    depends_on:
      - postgres


  web:
    build:
      context: ./frontend

    container_name: erp-web

    ports:
      - "3000:3000"

    depends_on:
      - api


volumes:
  postgres_data: